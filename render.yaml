services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /v3/api-docs
    envVars:
      # Motor MySQL. TiDB es compatible con el protocolo MySQL, asi que usa "mysql".
      - key: DB_ENGINE
        value: mysql
      # TiDB Cloud: gateway01.<region>.prod.aws.tidbcloud.com
      - key: DB_HOST
        sync: false
      # TiDB Cloud: 4000 | MySQL estandar: 3306
      - key: DB_PORT
        sync: false
      # Nombre de la base de datos ya creada en TiDB
      - key: DB_NAME
        sync: false
      # TiDB Cloud: <prefijo>.root
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TiDB Cloud exige TLS. Para un MySQL local sin TLS usa DISABLED.
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -XX:MaxMetaspaceSize=128m"
